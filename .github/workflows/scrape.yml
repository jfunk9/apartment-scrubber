name: Apartment Radar

on:
  push:
    branches: [main]
    paths:
      - 'buildings.csv'
      - 'apartment_scraper.py'
      - '.github/workflows/scrape.yml'
  schedule:
    # Weekly on Monday at 12:00 UTC (7am Central). Apartments turn slower than jobs.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python apartment_scraper.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listings.json index.html
          git diff --cached --quiet || git commit -m "auto: refresh listings $(date -u +'%Y-%m-%d')"
          git push
